constraints:
  - "Demo thresholds are configurable and must not be presented as enterprise safety standards."
  - "Human engineering sign-off remains required."
  - "No external service or credential is required for the prototype."
  - "T02 example profiles are unapproved descriptive_only packages with thresholds: null; they cannot produce acceptance, safety, conformity or release conclusions."
  - "Remote AI is optional; only structured evidence is sent and API keys remain server-side."
  - "Local history stores summaries only; raw test rows are excluded and a clear action is provided."
  - "Remote AI output is fail-closed on verdict conflict, missing evidence, or oversized output."
  - "The server-side AI route ignores client endpoint/model/key fields, requires an HTTPS hostname allowlist, aborts upstream requests after 15 seconds, and caps upstream response bytes before JSON parsing."
  - "Profile package input is fail-closed on invalid IDs, thresholds, unknown fields, or malformed mappings."
  - "Every profile consumer (browser, API, and batch watcher) must preserve evaluationMode; T02 descriptive_only profiles remain DESCRIPTIVE/NOT_RUN after routing and cannot silently fall back to risk_screening."
  - "An explicit mapping miss is surfaced as MAPPING_OVERRIDE_MISSING even when a generic alias fallback succeeds."
  - "Workflow readiness is a process checklist, not a conformity certificate; a FAIL verdict or missing evidence must remain visible as review/blocking state."
  - "Remote AI receives metadata presence flags, not operator names, calibration identifiers, raw-data references, or other testMetadata values."
  - "Public analysis/API/JSON surfaces redact metadata values, durability report bodies, and parameter workbook contents while retaining bounded presence/count summaries."
  - "Batch watch is explicit-directory, once/interval controlled, and does not send Feishu unless --send-alerts plus server environment credentials are present."
  - "Raw power_w is preferred for power/energy integration when present; voltage-current remains an independent cross-check. Explicitly labeled derived power may support descriptive KPIs, but it cannot satisfy an approved profile's required raw power_w measurement gate. These measurements remain non-conformity claims unless an approved profile supplies requiredMeasurements and acceptanceCriteria."
  - "Structured acquisition and pre-check gates only validate enterprise-supplied evidence shape and status; the prototype must not infer standard sampling rates, instrument precision, safety limits, or conformity."
  - "Structured test stages, test conditions, measurement methods, and efficiency evidence are profile-controlled; missing evidence blocks approved-profile readiness, and efficiency is never inferred from energy/flow."
  - "An approved profile must carry non-sensitive approvalEvidence with approverId, approvalDate, approvalRef, profileRevision matching revision, and profileRevisionRef; missing or mismatched evidence fails closed, while public surfaces expose presence/status only."
  - "A standard-referenced profile declaring FULL_METHOD_IMPLEMENTED must carry methodImplementationEvidence with method/source references, clause/step coverage items, per-item evidence references, verifier/date/reference, and openGaps: [], plus enterprise acceptance rules, instrument requirements, uncertaintyModelRequired: true, and a valid uncertainty model; any missing, mismatched, partial, or open-gap evidence fails closed and cannot produce HUMAN_REVIEW_PACKAGE."
  - "CSV SHA-256 is computed in the browser and stored as provenance; raw CSV content is not sent to the AI adapter."
  - "Versioned metricTrace may expose canonical source fields, opaque metric evidence IDs, valid source-hash status, evidence class and privacy-safe row locators; missing or malformed hashes stay unbound, and trace never implies standard conformity."
  - "Enterprise source files remain local; only schema adapters, synthetic tests, and derived non-raw documentation are committed."
  - "Vehicle and stack adapters fail closed on missing fields, insufficient timestamp resolution, or unapproved enterprise rules."
  - "Enterprise stack headers with explicit units must be converted to canonical units before KPI calculation; unsupported units fail closed and session-local phase time must not bridge source sessions."
  - "Parameter workbooks are read by sheet/header/code, not row number; invalid parameter packages block formal platform/stability processing."
  - "Generated Excel reports preserve effective parameters, mappings, quality checks, platform/stability results, anomalies, formulas, and processing log without embedding raw enterprise rows."
  - "Vehicle and stack multi-file sessions are explicit boundaries: target-current segments, insulation windows, platforms, and stable intervals never cross source files; vehicle display axes are independently scaled and do not change KPI semantics."
  - "Every cataloged enterprise signal receives descriptive numeric coverage when numeric values exist; catalog-only fields remain descriptive evidence and never create automatic conformity conclusions."
  - "When approved target parameters are absent, inferred current intervals are labeled descriptive_only and must not populate formal performance points, stable intervals, polarization points, or conformity conclusions."
  - "Example PEM profiles explicitly allow only generic datasets; stack, vehicle, and durability adapters must fail closed on profile scope mismatch instead of reusing a method for another device family."
  - "config/enterprise-profile.example.json is the profile source of truth and public/config/enterprise-profile.example.json must remain byte-identical; submission checks enforce parity."
  - "config/batch-declaration.example.json is the browser batch-declaration source of truth and public/config/batch-declaration.example.json must remain byte-identical; submission checks enforce parity."
  - "The T02 coverage audit emits bounded heartbeat progress and lazy-loads the existing project Mammoth browser bundle; browser multi-file import preserves reference-only and blocked-binary boundaries without expanding the processed-data or conformity definition."
  - "The T02 coverage audit emits a per-file usage ledger and package-level field-role union; analysis_input, context_or_cross_check, catalog_only, reference_only, blocked_binary, and declared_no_upload remain distinct, and the ledger cannot create a conformity claim."
  - "T02 source integrity validates the audit root, declared record count and path uniqueness in addition to per-file size/SHA-256; any audit-shape mismatch fails closed before file drift is accepted."
  - "Approved profiles with standard references must bind each reference status, method source, scope/workflow evidence, publication/effective dates and methodId; missing or inconsistent provenance fails package import."
  - "T02 coverage and reference audit commands write the current versioned evidence artifact by default; explicit input/output arguments remain supported for historical replay."
  - "The generated T02 integration report must show a separate field-use matrix for vehicle/stack and durability fields; missing roles render as zero, and the matrix must state that catalog or cross-check fields are not automatically KPIs or conformity claims."
  - "Cross-file T02 aggregation is fail-closed on missing enterprise batch declaration; testRunId, sessionGroup, file order, clock, sampling, and restart boundaries are required, and any resulting summary remains descriptive_only with per-file sessions preserved."
  - "Batch observation compares canonical per-file timestamps and median intervals with the declaration; missing/invalid sequences, undeclared overlap/rewind, and enterprise-declared sampling-tolerance violations remain NOT_READY, while no default sampling tolerance is invented."
  - "Approved profiles may require object traceability fields and structured manual edit logs; missing or malformed evidence remains NOT_READY. Public/API/Markdown/Excel surfaces expose only bounded status/count summaries and never raw operator identity or old/new value summaries."
  - "The submission archive must be self-contained: required runtime/build entries are checked, and packaging must pass clean extraction install, tests, typecheck, production build, server startup and HTTP smoke before writing the checksum."
  - "The optional local .openai/hosting.json is never packaged; package builds skip only the hosting-copy plugin when that local project configuration is absent."
  - "The optional hosting-copy plugin rechecks .openai/hosting.json at bundle close, so a missing or temporarily unavailable local config cannot fail the normal Vinext build; the file remains outside the submission archive."
  - "The npm xlsx dependency is not used directly and is removed; the vendored SheetJS 0.18.5 compatibility bundle remains a controlled local/enterprise-input risk and is not treated as security-certified."
  - "Raw parameter and time-series XLSX input is checked against a 64 MiB resource-protection limit before the vendored SheetJS parser; this is an input-safety boundary, not a GB/T, ISO or enterprise acceptance limit."
  - "Before SheetJS, XLSX/XLSM ZIP metadata is checked for a valid central directory, supported store/deflate methods, non-encrypted entries, non-ZIP64 layout, at most 2048 entries, at most 256 MiB declared expansion and at most 200:1 compression ratio; these are resource-protection limits, not standards limits."
  - "When a profile explicitly declares maxIntervalS or maxIntervalMultiplier, generic and phase trapezoid integration and its uncertainty propagation skip intervals above the declared limit; no interpolation is introduced, and skipped interval counts remain visible as integrationEvidence. Profiles without a declared gap limit retain descriptive integration and must not be described as formally accepted."
  - "Generic quality, phase, integration and uncertainty paths must treat session_id/source_file changes as hard boundaries; timestamps may restart at a new file, and no cross-file interval may enter a KPI without an explicit enterprise batch declaration."
  - "A declared phase with any sampling gap, session boundary, interruption, non-positive interval or missing integration input must expose partial/blocked status and must not retain energy, hydrogen-volume or specific-energy values as a complete formal phase result."
  - "Phase energy and phase hydrogen-volume completeness are independent: a complete power/time path may retain energyConsumedWh when flow_slpm is absent, while hydrogenVolumeNl remains null; specific energy requires both complete inputs."
  - "Markdown phase summaries must expose integrationStatus plus skipped-gap/session-boundary counts so a partial phase result cannot be mistaken for a complete calculation."
  - "A T02 blocked_binary source file must retain its SHA-256 and explicit binary/non-text reason; the public surface may explain the boundary but must not manufacture decoded rows or test conclusions."
  - "The shared text input boundary emits binaryReason values (nul_byte, control_byte_ratio, decoded_control_bytes or unsupported_bom_encoding) and all browser, batch-watch and T02 audit consumers must preserve that reason without widening the parser contract."
  - "Text decoding that produces Unicode replacement characters must fail closed with binaryReason=decode_replacement_character; malformed bytes must not enter CSV/TSV KPI analysis through a permissive decoder fallback."
  - "The public T02 coverage card must load its counts from the versioned t02-coverage-summary JSON generated by the current coverage audit; hard-coded values remain only as offline fallback and source/public summary files must be byte-parity checked."
  - "The GitHub Pages workflow must pin checkout, setup-node, configure-pages, upload-pages-artifact and deploy-pages to verified full SHAs; the Pages action set must be Node24-compatible and submission-check must fail on mutable action tags."
  - "The T02 coverage review download may contain only bounded aggregate field diagnostics and review reasons; it must not include raw rows or turn semantic/invalid-code review prompts into conformity or failure decisions."
evidence:
  automated: [tests/analyzer.test.mjs, tests/input-surface.test.mjs, tests/input-safety.test.mjs, tests/batch-aggregation.test.mjs, tests/batch-watch-cli.test.mjs, tests/evaluation-mode.test.mjs, tests/t02-audit.test.mjs, tests/t02-source-integrity.test.mjs, tests/standards-profile.test.mjs, scripts/ai-eval.mjs, scripts/submission-check.mjs, scripts/package-submission.mjs, scripts/profile-audit.mjs, scripts/t02-source-integrity.mjs, src/t02-report.mjs, scripts/t02-report.mjs, .research/ignite_t02_standards_20260821/t02_coverage_audit_v3.5.38.json, .research/ignite_t02_standards_20260821/t02_reference_audit_v3.5.38.json, .research/ignite_t02_standards_20260821/t02_integration_report_v3.5.38.md]
  api_smoke: [/api/ai-draft]
  manual: [docs/TEST_PLAN.md]
residual_risks:
  - "Enterprise field structures, parameter workbook import, multi-file browser batches, 14-sheet Excel report output, a validated OOXML chart writer path, and a server-side Feishu alert endpoint are connected; approved field dictionaries, thresholds, automatic incrementals, enterprise Feishu policies, Excel/WPS visual acceptance, and server audit are not yet complete."
  - "The default mode is deterministic local evidence synthesis; a real model gateway still needs enterprise approval and evaluation."
  - "The Sites production deployment is public; public availability must not be confused with enterprise profile approval."
  - "The Worker and display-sampling path is locally verified and has a main-thread fallback, but timing/interaction on the enterprise target browser and Excel/WPS visual acceptance still require human validation."
  - "The real T02 files have no enterprise batch declaration, so the current audit stops at per-file and package-level descriptive aggregation; cross-file time-series KPI merge and durability method/cycle equivalence remain open."
  - "Mammoth is upgraded to 1.12.1 and the browser bundle is synchronized; npm direct production dependency audit is clean after removing unused xlsx, but the vendored SheetJS 0.18.5 compatibility bundle is outside npm audit. The shared XLSX path now rejects oversized or structurally unsafe ZIP containers before parsing, but untrusted XLSX handling must remain local/sandboxed until the parsing stack is replaced or otherwise revalidated, including formula/macro, prototype-pollution and ReDoS tests."
